<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d18" media="(prefers-color-scheme: dark)" />
    <title>7 Audio — AI Audio Toolkit</title>
    <meta name="description" content="7 Audio — audio tools, perfected. Remove vocals, split stems, clean noise, cut, join, pitch-shift and convert audio. Fast, secure and free to use." />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-180.png" />

    <!-- Installable. iOS ignores the manifest's display mode and needs its own tags. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="7 Audio" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="7 Audio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* Pre-hydration splash — prevents a blank white flash before React mounts. */
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #fbfbfe; z-index: 9999; }
      html[data-theme='dark'] #boot { background: #0b0d18; }
      #boot .ring { width: 116px; height: 116px; border-radius: 50%; border: 2px solid rgba(109, 60, 235, 0.14); border-top-color: rgba(109, 60, 235, 0.7); animation: bootspin 900ms linear infinite; }
      @keyframes bootspin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot .ring { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot"><div class="ring"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
