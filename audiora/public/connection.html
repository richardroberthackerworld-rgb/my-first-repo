<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Connection needed — 7 Audio</title>
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <style>
      /*
        Shown only when the device cannot reach 7 Audio at all — a launched-
        from-home-screen app would otherwise show the browser's raw error page.
        Self-contained on purpose: the stylesheet it would normally use may be
        exactly what could not be fetched.
      */
      :root {
        --bg: #fbfbfe;
        --surface: #ffffff;
        --text: #0f1222;
        --muted: #585d78;
        --border: rgba(15, 18, 34, 0.08);
        --brand: #5b2ce0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0d18;
          --surface: #131629;
          --text: #eceefb;
          --muted: #a2a8c8;
          --border: rgba(255, 255, 255, 0.09);
          --brand: #8b6cf5;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.5;
      }
      .box {
        width: 100%;
        max-width: 420px;
        padding: 32px 26px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
      }
      .mark { width: 72px; height: 72px; margin: 0 auto 18px; display: block; }
      h1 { font-size: 21px; margin: 0 0 10px; letter-spacing: -0.02em; }
      p { font-size: 14.5px; color: var(--muted); margin: 0 0 22px; }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 14px;
        background: var(--brand);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
      button:active { transform: scale(0.99); }
    </style>
  </head>
  <body>
    <div class="box">
      <img class="mark" src="/brand/app-icon.svg" alt="" />
      <h1>7 Audio needs a connection</h1>
      <p>We could not reach the internet. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
    <script>
      // Come back on its own the moment the connection returns.
      addEventListener('online', function () {
        location.replace('/');
      });
    </script>
  </body>
</html>
