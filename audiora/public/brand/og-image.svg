<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!--
    Link preview card, 1200x630 — the size Facebook, WhatsApp, LinkedIn, Slack,
    Discord and X all crop from. Rasterised to brand/og-image.png at build
    time; this SVG is the editable source.

    Kept deliberately plain: a preview is often shown at a couple of hundred
    pixels wide, so the wordmark and one line of copy is all that survives.
  -->
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0E1A"/>
      <stop offset="0.55" stop-color="#161233"/>
      <stop offset="1" stop-color="#231448"/>
    </linearGradient>
    <linearGradient id="ogSeven" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="0.55" stop-color="#5B2CE0"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="ogGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6D3CEB" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6D3CEB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <ellipse cx="980" cy="120" rx="420" ry="300" fill="url(#ogGlow)"/>

  <!-- Waveform band, low contrast, purely decorative. -->
  <g fill="#8B5CF6" opacity="0.20">
    <rect x="72"  y="470" width="14" height="46"  rx="7"/>
    <rect x="102" y="446" width="14" height="94"  rx="7"/>
    <rect x="132" y="418" width="14" height="150" rx="7"/>
    <rect x="162" y="452" width="14" height="82"  rx="7"/>
    <rect x="192" y="430" width="14" height="126" rx="7"/>
    <rect x="222" y="462" width="14" height="62"  rx="7"/>
    <rect x="252" y="440" width="14" height="106" rx="7"/>
    <rect x="282" y="474" width="14" height="38"  rx="7"/>
    <rect x="312" y="452" width="14" height="82"  rx="7"/>
    <rect x="342" y="424" width="14" height="138" rx="7"/>
    <rect x="372" y="458" width="14" height="70"  rx="7"/>
    <rect x="402" y="436" width="14" height="114" rx="7"/>
  </g>

  <!-- Icon tile. -->
  <rect x="72" y="88" width="132" height="132" rx="34" fill="#FFFFFF"/>
  <g transform="translate(138 154) scale(0.20) translate(-256 -288)">
    <path
      d="M126 104h248c25.5 0 41.1 21.3 31.9 44.7L281.4 452c-7.8 19.9-29.1 29.1-47.5 21.6-19.1-7.8-27.6-29.4-19.8-48.5L305.6 182H126c-21.3 0-39-17.4-39-39s17.7-39 39-39Z"
      fill="url(#ogSeven)"/>
    <g fill="#0B0E1A">
      <rect x="196" y="300" width="26" height="44" rx="13" fill="#3B2BF5"/>
      <rect x="230" y="272" width="26" height="100" rx="13"/>
      <rect x="264" y="248" width="26" height="148" rx="13"/>
      <rect x="298" y="222" width="26" height="200" rx="13"/>
      <rect x="332" y="256" width="26" height="132" rx="13"/>
      <rect x="366" y="280" width="26" height="84" rx="13"/>
      <rect x="400" y="302" width="26" height="40" rx="13" fill="#3B2BF5"/>
    </g>
  </g>

  <text x="232" y="176" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif"
        font-size="72" font-weight="800" letter-spacing="-2" fill="#FFFFFF">7 Audio</text>

  <text x="72" y="316" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif"
        font-size="60" font-weight="800" letter-spacing="-1.6" fill="#FFFFFF">Remove vocals. Split stems.</text>
  <text x="72" y="386" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif"
        font-size="60" font-weight="800" letter-spacing="-1.6" fill="#A78BFA">Clean up any recording.</text>

  <text x="72" y="440" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif"
        font-size="27" font-weight="500" fill="#A2A8C8">Seven AI audio tools in one place — free to start</text>

  <text x="1128" y="560" text-anchor="end"
        font-family="'JetBrains Mono', 'Consolas', monospace"
        font-size="24" font-weight="500" fill="#6E76A0">7audio.7by.in</text>
</svg>
