<body>

<!-- =====================================================================
     PRELOADER — opening a student's notebook.
     The bar, the percentage and the rocket all read from one clock, so they
     can never disagree. Two independent timeouts guarantee removal, so a
     stalled animation can never trap the app behind this screen.
     ===================================================================== -->
<div id="pre" role="status" aria-label="Loading 7Marks">
  <div class="pre-in">
    <div class="pre-logo" id="preLogo"></div>
    <h1 class="pre-name"><b>7</b>Marks</h1>
    <p class="pre-tag">Practice Smart. Score <i>7</i> Marks!</p>
    <p class="pre-sub">AI-Powered Practice &nbsp;·&nbsp; Smart Correction &nbsp;·&nbsp; Better Results</p>

    <svg class="pre-book" viewBox="0 0 300 150" aria-hidden="true">
      <path d="M150 26 C124 12 78 10 26 16 L26 128 C78 122 124 124 150 138 Z"
            fill="#fff" stroke="#16295c" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M150 26 C176 12 222 10 274 16 L274 128 C222 122 176 124 150 138 Z"
            fill="#fff" stroke="#16295c" stroke-width="2.4" stroke-linejoin="round"/>
      <g stroke="#c9d6ee" stroke-width="1.3">
        <path d="M42 40h88M42 56h88M42 72h80M42 88h66M42 104h48"/>
        <path d="M172 40h88M172 56h88M172 72h80M172 88h66"/>
      </g>
      <g stroke="#8fa3c8" stroke-width="2.2" fill="none">
        <path d="M150 30v104"/>
        <path d="M144 40h12M144 58h12M144 76h12M144 94h12M144 112h12"/>
      </g>
      <!-- Each line is revealed left-to-right by its own clip rect, so the
           quote appears to be written by hand as the pen travels over it. -->
      <!-- The reveal grows each clip rect's width from 0, so the quote is
           written left to right.

           Driven by JavaScript (M7.writeQuote), not CSS and not SMIL. Both
           of those were tried and neither could be verified from here, and
           SMIL did not animate in the real browser either. The JS version is
           a pure function of elapsed time, so it can be stepped and asserted
           against without needing a compositor.

           data-w is the finished width, data-b when the line starts and
           data-d how long it takes. The width attribute already holds the
           finished value, so if the script never runs the quote simply
           appears — the degraded state is "no animation", never "no text". -->
      <defs>
        <clipPath id="c1"><rect class="wr" data-w="96"  data-b="0.65" data-d="0.60" x="44"  y="40"  width="96"  height="16"/></clipPath>
        <clipPath id="c2"><rect class="wr" data-w="106" data-b="1.25" data-d="0.60" x="44"  y="60"  width="106" height="16"/></clipPath>
        <clipPath id="c3"><rect class="wr" data-w="100" data-b="1.85" data-d="0.55" x="44"  y="80"  width="100" height="16"/></clipPath>
        <clipPath id="c4"><rect class="wr" data-w="126" data-b="2.40" data-d="0.70" x="44"  y="100" width="126" height="16"/></clipPath>
        <clipPath id="c5"><rect class="wr" data-w="76"  data-b="3.20" data-d="0.45" x="174" y="50"  width="76"  height="28"/></clipPath>
        <clipPath id="c6"><rect class="wr" data-w="90"  data-b="3.70" data-d="0.50" x="174" y="78"  width="90"  height="28"/></clipPath>
        <clipPath id="c7"><rect class="wr" data-w="68"  data-b="4.25" data-d="0.35" x="172" y="102" width="68"  height="16"/></clipPath>
      </defs>
      <text class="quote" clip-path="url(#c1)" x="44" y="52">The best</text>
      <text class="quote" clip-path="url(#c2)" x="44" y="72">preparation for</text>
      <text class="quote" clip-path="url(#c3)" x="44" y="92">tomorrow is</text>
      <text class="quote" clip-path="url(#c4)" x="44" y="112">doing your best today.</text>
      <text class="begin" clip-path="url(#c5)" x="176" y="72">Let's</text>
      <text class="begin" clip-path="url(#c6)" x="176" y="100">Begin!</text>
      <path clip-path="url(#c7)" d="M176 110 q28 8 56 -2" stroke="#e6202a" stroke-width="2"
            fill="none" stroke-linecap="round"/>
      <g class="pre-pen">
        <g transform="rotate(28 250 90)">
          <rect x="244" y="34" width="11" height="62" rx="5" fill="#22376f"/>
          <path d="M244 96 h11 l-5.5 16 Z" fill="#16295c"/>
          <rect x="244" y="46" width="11" height="5" fill="#cbd5ea"/>
        </g>
      </g>
      <text x="12" y="18" font-size="13" fill="#a9bbdb">&#10023;</text>
      <text x="284" y="142" font-size="13" fill="#a9bbdb">&#10023;</text>
    </svg>

    <p class="pre-load">Loading your learning space...</p>

    <div class="pre-prog">

        <div class="pre-fill" id="preFill"></div>
        <span class="pre-rocket" id="preRocket">🚀</span>

</div>

<script>
/* =====================================================================
   BOOT — run the preloader, then hand over to the app.
   The app is built and revealed on a guaranteed schedule; the preloader is
   never the thing that decides whether the product is reachable.
   ===================================================================== */
(function (w, d) {
  'use strict';
  var M = w.M7;
  var pre = d.getElementById('pre'), app = d.getElementById('app');

  d.getElementById('preLogo').innerHTML = M.mark(96);

  var FEATS = [
    ['🤖', 'violet', 'AI Correction', 'Instant feedback like a teacher'],
    ['⏱️', 'blue', 'Smart Timers', 'Set time, focus &amp; ace exams'],
    ['📝', 'green', 'Mock Tests', 'Real exam experience'],
    ['📊', 'orange', 'Performance', 'Track progress &amp; improve'],
    ['🔖', 'pink', 'Save &amp; Revise', 'Bookmarks, notes &amp; flashcards'],
    ['🏆', 'gold', 'Achievements', 'Stay motivated, earn rewards']
  ];
  d.getElementById('preFeats').innerHTML = FEATS.map(function (f, i) {
    return '<div class="pre-feat" style="animation-delay:' + (0.6 + i * 0.09) + 's">' +
      '<span style="background:var(--' + f[1] + '-bg);color:var(--' + f[1] + ')">' + f[0] + '</span>' +
      '<b>' + f[2] + '</b><i>' + f[3] + '</i></div>';
  }).join('');

  var reduce = false;
  try { reduce = matchMedia('(prefers-reduced-motion:reduce)').matches; } catch (e) {}
  /* a student who already saw it this session should not sit through it again */
  var seen = false;
  try { seen = !!sessionStorage.getItem('7m.seen'); sessionStorage.setItem('7m.seen', '1'); } catch (e) {}

  /* write the quote out by hand; it fails to "already written", never blank */
  var quote = M.writeQuote(pre, { instant: reduce || seen });

  /* the preloader must outlast the writing, or the student never sees it */
  var DUR = (reduce || seen) ? 350 : 5200;
  var fill = d.getElementById('preFill'), pct = d.getElementById('prePct'),
      rocket = d.getElementById('preRocket');
  var t0 = performance.now(), finished = false, booted = false;

  (function tick(now) {
    var p = Math.min(1, ((now || performance.now()) - t0) / DUR);
    var e = 1 - Math.pow(1 - p, 2.2);        /* ease out: it settles, not stops dead */
    fill.style.width = (e * 100) + '%';
    rocket.style.left = (e * 100) + '%';
    pct.textContent = Math.round(e * 100) + '%';
    if (p < 1) requestAnimationFrame(tick); else finish();
  })();

  function finish() {
    if (finished) return;
    finished = true;
    if (quote) quote.finish();      /* never fade out mid-word */
    boot();
    pre.classList.add('done');
    setTimeout(function () { if (pre.parentNode) pre.parentNode.removeChild(pre); }, 520);
  }
  d.getElementById('preSkip').onclick = finish;
  /* two belts: whatever happens to the animation, the app appears */
  setTimeout(finish, DUR + 1200);
  setTimeout(function () {
    if (pre.parentNode) pre.parentNode.removeChild(pre);
    if (!app.classList.contains('ready')) boot();
  }, 8000);

  function boot() {
    if (booted) return;
    booted = true;
    try {
      w.V.mountChrome();
      M.router.start();
      app.classList.add('ready');

      /* an attempt interrupted by a refresh or a crash resumes with the
         correct remaining time — the deadline is stored, not counted */
      var live = M.exam.restore();
      if (live) {
        M.toast('⏱️ Resumed “' + live.title + '” — ' +
          Math.ceil(M.exam.left() / 60) + ' min left', 'warn', 5000);
      }

      /* count study minutes toward the daily goal, only while visible */
      setInterval(function () {
        if (d.hidden) return;
        M.store.set('todayMins', M.store.get('todayMins', 0) + 1);
      }, 60000);

      /* leaving mid-exam should not happen by accident */
      w.addEventListener('beforeunload', function (e) {
        if (M.exam.s && !M.exam.s.submitted && !M.exam.s.locked) {
          e.preventDefault(); e.returnValue = '';
        }
      });
    } catch (err) {
      /* never leave a blank page: say what broke and offer a way forward */
      d.getElementById('page').innerHTML =
        '<div class="wrap"><div class="col"><section class="card"><div class="card-b">' +
        '<div class="empty"><span class="em">⚠️</span><b>Something failed to start</b>' +
        '<small>' + String((err && err.message) || err).replace(/[<>&]/g, '') + '</small>' +
        '<button class="btn btn-v" onclick="location.reload()">Reload the page</button>' +
        '</div></div></section></div></div>';
      app.classList.add('ready');
      throw err;
    }
  }
})(window, document);
</script>
